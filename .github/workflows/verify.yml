name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Apple Silicon build and package
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm Apple Silicon runner
        run: |
          uname -a
          test "$(uname -m)" = "arm64"

      - name: Install build prerequisite
        run: brew install pkg-config

      - name: Validate shell syntax
        run: |
          bash -n \
            build.sh \
            install.sh \
            package.sh \
            test-filter.sh \
            uninstall.sh \
            packaging/postinstall \
            packaging/setup-queue

      - name: Build Gutenprint and L120 PPD
        run: ./build.sh

      - name: Run offline render test
        run: ./test-filter.sh

      - name: Build unsigned package
        run: ./package.sh

      - name: Verify release checksums
        run: |
          cd dist
          shasum -a 256 -c SHA256SUMS.txt

      - name: Inspect package payload
        run: |
          PKG="dist/EpsonL120-macOS-arm64-0.1.0.pkg"
          test -s "$PKG"
          pkgutil --payload-files "$PKG" > /tmp/epson-l120-payload.txt
          grep -F './Library/Printers/EpsonL120/libexec/rastertogutenprint.5.3' /tmp/epson-l120-payload.txt
          grep -F './Library/Printers/EpsonL120/lib/libgutenprint.9.dylib' /tmp/epson-l120-payload.txt
          grep -F './Library/Printers/EpsonL120/Epson_L120-Gutenprint.ppd' /tmp/epson-l120-payload.txt
          grep -F './Library/Printers/EpsonL120/bin/setup-queue' /tmp/epson-l120-payload.txt
